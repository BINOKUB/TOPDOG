<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOPDOG - Démo</title>
    
    
   <style>

       * { box-sizing: border-box; }
        /* 1. FOND ET LAYOUT (STRATÉGIE SANDWICH) */
        html, body {
            background-color: #000 !important;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #000 70%);
            
            /* Hauteur dynamique 100% de l'écran visible */
            height: 100dvh; 
            margin: 0; padding: 0;
            
            display: flex; 
            flex-direction: column; 
            
            /* C'est ICI le secret : On écarte les éléments au max */
            /* Le titre monte, le bouton descend, la grille reste au milieu */
            justify-content: space-between; 
            align-items: center;
            
            overflow: hidden; /* Pas de scroll */
            
            /* Marges de sécurité pour ne pas coller aux bords du téléphone */
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: max(50px, env(safe-area-inset-bottom));
        }
        
        /* 2. LE TITRE (FIXÉ EN HAUT) */
        .demo-title {
            flex: 0 0 auto; /* Ne rétrécit pas */
            font-size: clamp(1.2em, 5vw, 1.8em);
            color: #fff; font-weight: 900;
            text-shadow: 0 0 15px #00f3ff;
            text-transform: uppercase; letter-spacing: 3px;
            text-align: center;
            margin-bottom: 10px;
        }

        /* 3. CONTENEUR CENTRAL (LA GRILLE) */
        .demo-container {
            /* FLEXIBILITÉ TOTALE */
            flex: 1; /* Occupe tout l'espace libre au milieu */
            min-height: 0; /* Autorise le rétrécissement extrême si nécessaire */
            
            display: flex; align-items: center; justify-content: center;
            position: relative;
            width: 100%;
        }

        /* 4. LA GRILLE ELLE-MÊME */
        #game-grid {
            pointer-events: none;
            border: 2px solid #00f3ff;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
            background: #000;
            border-radius: 15px;
            
            display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); gap: 2px;
            padding: 4px;
            
            /* TAILLE INTELLIGENTE */
            /* La grille essaie de faire 320px */
            /* MAIS elle ne dépassera jamais la largeur de l'écran (90%) */
            /* ET SURTOUT : elle ne dépassera jamais l'espace libre en hauteur ! */
            width: auto;
            height: auto;
            max-width: min(320px, 90vw);
            max-height: min(320px, 90vw);
            
            aspect-ratio: 1 / 1; /* Carré parfait obligatoire */
        }

        /* TUILES */
        .tile {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            /* Police adaptative */
            font-size: clamp(10px, 4cqi, 20px); 
            font-weight: bold; border-radius: 3px;
            background: #111; color: #555;
        }
        .tile.nine {
            background: #ff00ff !important; color: #fff !important;
            font-size: 1.4em; border: 2px solid #fff; z-index: 10;
        }
        .tile.val-4, .tile.val-5 { color: #fff; background: #333; border: 1px solid #2ecc71; }
        .tile.val-7, .tile.val-2 { color: #fff; background: #333; border: 1px solid #f1c40f; }
        .tile.val-6, .tile.val-3 { color: #fff; background: #333; border: 1px solid #e74c3c; }
        .tile.empty { background: transparent; border: 1px dashed #222; }
        .tile.selected { background: #fff !important; color: #000 !important; transform: scale(1.1); }

        /* 5. BULLE D'INFO */
        .math-bubble {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00f3ff;
            color: #fff;
            
            padding: 10px 20px; border-radius: 15px;
            font-weight: 900; 
            font-size: clamp(1em, 4vw, 1.4em);
            
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
            
            opacity: 0; transition: opacity 0.3s, transform 0.3s;
            z-index: 2000; pointer-events: none;
            white-space: nowrap;
        }

        /* 6. MAIN FANTÔME */
        #ghost-hand {
            position: absolute; font-size: 40px; z-index: 3000;
            transition: all 0.5s ease-in-out; pointer-events: none; display: none;
            filter: drop-shadow(0 0 5px #000);
            /* Important : La main est positionnée par JS, rien à changer ici */
        }

        /* 7. BOUTON RETOUR (FIXÉ EN BAS) */
        .btn-close-demo {
            flex: 0 0 auto; /* Ne rétrécit pas */
            margin-top: 10px;
            background: transparent; border: 2px solid #00f3ff; color: #00f3ff;
            padding: 15px 40px; border-radius: 50px;
            font-size: 1em; cursor: pointer; text-decoration: none; font-weight: bold;
            text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
        }
        .btn-close-demo:hover { background: #00f3ff; color: #000; box-shadow: 0 0 20px #00f3ff; }

    </style>

    
</head>
<body>

    <div class="demo-title">COMMENT JOUER</div>

    <div class="demo-container">
        <div id="game-grid"></div>
        <div id="ghost-hand">👆</div>
        <div id="math-display" class="math-bubble"></div>
    </div>

    <a href="index.html" class="btn-close-demo">J'AI COMPRIS</a>

    <script>
        const gridEl = document.getElementById('game-grid');
        const hand = document.getElementById('ghost-hand');
        const bubble = document.getElementById('math-display');

        // ETAT GLOBAL DE LA GRILLE
        let demoState = [];

        // --- GÉNÉRATEUR DE GRILLE ---
        function resetGrid(type) {
            // Remplit de vide
            demoState = Array(8).fill().map(() => Array(8).fill(0));
            
            // Remplit de "bruit" (décor) autour pour faire joli
            demoState[0][0] = 1; demoState[0][7] = 8; demoState[7][0] = 3; demoState[7][7] = 6;

            if(type === 1) { // VERTICAL (CHIEN)
                demoState[2][3] = 9; // Chien
                demoState[3][3] = 4; // 4
                demoState[4][3] = 5; // 5
            } 
            else if(type === 2) { // DIAGONAL
                demoState[3][3] = 7; 
                demoState[4][4] = 2; 
                demoState[2][3] = 1; // Décor
            } 
            else if(type === 3) { // HORIZONTAL
                demoState[4][2] = 6;
                demoState[4][3] = 3;
                demoState[5][2] = 8; // Décor
            }
            renderGrid();
        }

        function renderGrid() {
            gridEl.innerHTML = '';
            for(let r=0; r<8; r++) {
                for(let c=0; c<8; c++) {
                    let val = demoState[r][c];
                    let tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.r = r; tile.dataset.c = c;
                    
                    if(val === 9) {
                        tile.classList.add('nine'); tile.innerText = '🐕'; 
                    } else if (val > 0) {
                        tile.innerText = val; tile.classList.add('val-'+val);
                    } else {
                        tile.classList.add('empty');
                    }
                    gridEl.appendChild(tile);
                }
            }
        }

        // --- MOTEUR DES SCÉNARIOS ---
        async function runFullDemo() {
            while(true) {
                // SCÉNARIO 1 : VERTICAL
                resetGrid(1);
                showBubble("VERTICAL ↕️");
                await wait(1500);
                await playMove(3,3, 4,3, "4 + 5 = 9", true); // True = Chute du chien
                await wait(1000);

                // SCÉNARIO 2 : DIAGONAL
                resetGrid(2);
                showBubble("DIAGONAL ↗️");
                await wait(1500);
                await playMove(3,3, 4,4, "7 + 2 = 9", false);
                await wait(1000);

                // SCÉNARIO 3 : HORIZONTAL
                resetGrid(3);
                showBubble("HORIZONTAL ↔️");
                await wait(1500);
                await playMove(4,2, 4,3, "6 + 3 = 9", false);
                await wait(1000);
            }
        }

        // --- FONCTION GÉNÉRIQUE POUR JOUER UN COUP ---
        async function playMove(r1, c1, r2, c2, text, isDogFall) {
            hideBubble();
            await wait(500);

            // Clic 1
            await moveHandTo(r1, c1);
            highlight(r1, c1);
            await wait(400);

            // Clic 2
            await moveHandTo(r2, c2);
            highlight(r2, c2);
            await wait(400);

            // Explication
            showBubble(text);
            await wait(1500);
            hideBubble();

            // Disparition
            hand.style.display = 'none';
            let t1 = document.querySelector(`.tile[data-r="${r1}"][data-c="${c1}"]`);
            let t2 = document.querySelector(`.tile[data-r="${r2}"][data-c="${c2}"]`);
            if(t1) t1.style.transform = "scale(0)";
            if(t2) t2.style.transform = "scale(0)";
            await wait(300);

            // Mise à jour logique (visuelle)
            demoState[r1][c1] = 0;
            demoState[r2][c2] = 0;
            
            if(isDogFall) {
                // Fait tomber le chien qui était au dessus (hardcodé pour la démo)
                demoState[r1][c1] = 9; 
                demoState[r1-1][c1] = 0; 
            }
            renderGrid();

            if(isDogFall) {
                showBubble("LE CHIEN DESCEND !");
                await wait(2000);
                hideBubble();
            }
        }

        // --- OUTILS ---
        function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

        function moveHandTo(r, c) {
            return new Promise(resolve => {
                hand.style.display = 'block';
                const tile = document.querySelector(`.tile[data-r="${r}"][data-c="${c}"]`);
                if(tile) {
                    // Calcul précis relatif au conteneur .demo-container
                    // On n'utilise pas getBoundingClientRect de la page entière, mais les offsets
                    const tileLeft = tile.offsetLeft;
                    const tileTop = tile.offsetTop;
                    const tileW = tile.offsetWidth;
                    const tileH = tile.offsetHeight;

                    // On ajoute le padding de la grille (4px)
                    hand.style.left = (tileLeft + 4 + tileW/2 - 20) + 'px';
                    hand.style.top = (tileTop + 4 + tileH/2) + 'px';
                    
                    hand.style.transform = 'scale(1.2)';
                    setTimeout(() => {
                        hand.style.transform = 'scale(1)';
                        resolve();
                    }, 400);
                } else { resolve(); }
            });
        }

        function highlight(r, c) {
            const tile = document.querySelector(`.tile[data-r="${r}"][data-c="${c}"]`);
            if(tile) tile.classList.add('selected');
        }

        function showBubble(text) {
            bubble.innerText = text;
            bubble.style.opacity = 1;
            bubble.style.transform = "translate(-50%, -50%) scale(1)";
        }
        function hideBubble() { 
            bubble.style.opacity = 0; 
            bubble.style.transform = "translate(-50%, -50%) scale(0.8)";
        }

        // DÉMARRAGE
        window.onload = () => {
            runFullDemo();
        };
    </script>
</body>
</html>
