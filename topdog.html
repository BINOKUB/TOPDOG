<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TOPDOG</title>
    
    <link rel="manifest" href="./manifest.json">
    
    <link rel="stylesheet" href="style.css?v=FINAL">
    <link rel="stylesheet" href="badges.css"> 
    <link id="skin-stylesheet" rel="stylesheet" href="">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* --- LAYOUT MOBILE ROBUSTE --- */
        html {
            height: 100%;
        }
        body { 
            /* 100dvh = Hauteur dynamique qui tient compte de la barre d'adresse mobile */
            height: 100dvh; 
            margin: 0; padding: 0;
            overflow: hidden; /* Interdit le scroll */
            background: #000;
            transition: background 0.5s ease;
            
            /* FLEXBOX VERTICAL : Pour tout empiler proprement */
            display: flex; 
            flex-direction: column; 
            
            overscroll-behavior: none; 
            -webkit-user-select: none; user-select: none; 
            -webkit-tap-highlight-color: transparent; 
        }

        /* 1. ÉCRAN TITRE */
        #start-screen {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: #050505; z-index: 999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .logo-title {
            font-size: 3em; font-weight: 900; font-style: italic;
            background: linear-gradient(45deg, #fff, #888);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 20px; letter-spacing: 4px;
        }
        .btn-start {
            background: #e67e22; color: #fff; border: none;
            padding: 15px 40px; font-size: 1.5em; font-weight: bold;
            border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 20px rgba(230, 126, 34, 0.4);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* 2. ÉLÉMENTS FIXES (Ne rétrécissent jamais) */
        .top-bar, .hud, .controls {
            flex-shrink: 0; /* INTERDIT de rétrécir ces zones */
            z-index: 10;
        }

        /* 3. LE CŒUR DU JEU (Flexible) */
        .game-container {
            flex-grow: 1; /* Prend tout l'espace restant */
            min-height: 0; /* CRUCIAL : Autorise le contenu à rétrécir si l'écran est petit */
            display: flex; 
            align-items: center; 
            justify-content: center;
            width: 100%;
            position: relative;
        }

        /* La grille s'adapte à l'espace disponible */
        #game-grid {
            max-width: 95%;
            max-height: 95%; /* Ne jamais dépasser la zone flexible */
            aspect-ratio: 1 / 1; /* Reste carré */
            /* Pas de taille fixe en px ici, on laisse le flex gérer */
        }

        /* 4. CONTRÔLES (Boutons du bas) */
        .controls {
            padding-bottom: env(safe-area-inset-bottom, 20px); /* Marge pour la barre iPhone */
            padding-top: 10px;
            background: rgba(0,0,0,0.2); /* Léger fond */
            display: flex; justify-content: center; gap: 10px;
        }
        
        /* Ajustements boutons pour petits écrans */
        .controls button {
            padding: 12px 20px;
            font-size: 1em;
        }

        /* --- MEDIA QUERIES (Ajustements fins) --- */
        @media (max-height: 700px) {
            .logo-title { font-size: 2em; }
            .top-bar h1 { font-size: 1.5em; margin: 0; }
            .hud { padding: 5px; }
            .controls button { padding: 8px 15px; font-size: 0.9em; }
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <div class="logo-title">TOPDOG</div>
        <div style="color:#666; margin-bottom:30px; font-family:monospace;">V1.3 - GOLD EDITION</div>
        <button class="btn-start" onclick="launchApp()">JOUER</button>
    </div>

    <div class="top-bar">
        <div style="display: flex; align-items: center;">
            <h1>TOPDOG</h1>
            <span id="player-badge" class="badge badge-sheep">🐑 BREBIS</span>
        </div>

        <div class="header-buttons">
            <button class="btn-circle" onclick="window.location.href='store.html'" style="font-size:1.2em;">🛍️</button>
            <button class="btn-circle" id="btn-sound">🔊</button>
            <button class="btn-circle" id="btn-rules">?</button>
        </div>
    </div>

    <div id="betting-board"></div>
    <div class="hud">
        <div class="hud-item">
            <span class="hud-label">RÉSERVE</span>
            <span id="reserve-count" class="hud-value skin-text">&infin;</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">TEMPS</span>
            <span id="timer-container" class="hud-value">02:00</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">BANQUE</span>
            <span id="score-display" class="hud-value highlight">0</span>
        </div>
    </div>

    <div class="game-container">
        <div id="game-grid"></div>
        <div id="message-overlay"></div>
    </div>

    <div class="controls">
        <button id="btn-hint">INDICE</button>
        <button id="btn-shuffle">BRASSER (<span id="shuffle-count">1</span>)</button>
        <button id="btn-reset">RESET</button>
    </div>

    <script>
        function launchApp() {
            document.getElementById('start-screen').style.display = 'none';
            if(window.audioCtx && window.audioCtx.state === 'suspended') {
                window.audioCtx.resume();
            }
            if(typeof startGame === 'function') {
                startGame();
            }
        }
    </script>

    <script src="catalog.js?v=FINAL"></script>
    <script src="cosmetics.js?v=FINAL"></script>
    <script src="logic.js?v=FINAL"></script>
    <script src="ui.js?v=FINAL"></script>

    <script>
        window.addEventListener('load', function() {
            console.log("🚀 Lancement du système TopDog...");
            if(typeof Cosmetics !== 'undefined') Cosmetics.init();
            updateBadge();
        });

        function updateBadge() {
            const badgeEl = document.getElementById('player-badge');
            const inventory = JSON.parse(localStorage.getItem('topdog_inventory_badge') || '[]');
            
            if (inventory.includes('badge_goat')) {
                badgeEl.className = 'badge badge-goat'; badgeEl.innerHTML = '🐐 G.O.A.T.';
            } else if (inventory.includes('badge_legend')) {
                badgeEl.className = 'badge badge-legend'; badgeEl.innerHTML = '💎 LEGEND';
            } else if (inventory.includes('badge_apex')) {
                badgeEl.className = 'badge badge-apex'; badgeEl.innerHTML = '👑 APEX';
            } else if (inventory.includes('badge_alpha')) {
                badgeEl.className = 'badge badge-alpha'; badgeEl.innerHTML = '🐺 ALPHA';
            } else {
                badgeEl.className = 'badge badge-sheep'; badgeEl.innerHTML = '🐑 BREBIS';
            }
        }
    </script>

</body>
</html>
