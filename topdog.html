<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TOPDOG</title>
    
    <link rel="manifest" href="./manifest.json">

    <link rel="stylesheet" href="style.css?v=FORCE_UPDATE_V5">
       <link rel="stylesheet" href="badges.css"> 
    <link id="skin-stylesheet" rel="stylesheet" href="">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div id="start-screen">
        <div class="logo-title">TOPDOG</div>
        <div style="color:#666; margin-bottom:30px; font-family:monospace;">V1.3 - GOLD EDITION</div>
        <button class="btn-start" onclick="launchApp()">JOUER</button>
    </div>

    <div class="top-bar">
        <div style="display: flex; align-items: center;">
            <h1>TOPDOG</h1>
            <span id="player-badge" class="badge badge-sheep">🐑 BREBIS</span>
        </div>

        <div class="header-buttons">
            <button class="btn-circle" onclick="window.location.href='store.html'" style="font-size:1.2em;">🛍️</button>
            <button class="btn-circle" id="btn-sound">🔊</button>
            <button class="btn-circle" id="btn-rules">?</button>
        </div>
    </div>

    <div id="betting-board"></div>
    <div class="hud">
        <div class="hud-item">
            <span class="hud-label">RÉSERVE</span>
            <span id="reserve-count" class="hud-value skin-text">&infin;</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">TEMPS</span>
            <span id="timer-container" class="hud-value">02:00</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">BANQUE</span>
            <span id="score-display" class="hud-value highlight">0</span>
        </div>
    </div>

    <div class="game-container">
        <div id="game-grid"></div>
        <div id="message-overlay"></div>
    </div>

    <div class="controls">
        <button id="btn-hint">INDICE</button>
        <button id="btn-shuffle">BRASSER (<span id="shuffle-count">1</span>)</button>
        <button id="btn-reset">RESET</button>
    </div>

    <script>
        function launchApp() {
            document.getElementById('start-screen').style.display = 'none';
            if(window.audioCtx && window.audioCtx.state === 'suspended') {
                window.audioCtx.resume();
            }
            if(typeof startGame === 'function') {
                startGame();
            }
        }
    </script>

    <script src="catalog.js?v=FINAL"></script>
    <script src="cosmetics.js?v=FINAL"></script>
    <script src="logic.js?v=FINAL"></script>
    <script src="ui.js?v=FINAL"></script>

    <script>
        window.addEventListener('load', function() {
            if(typeof Cosmetics !== 'undefined') Cosmetics.init();
            updateBadge();
        });

        function updateBadge() {
            const badgeEl = document.getElementById('player-badge');
            const inventory = JSON.parse(localStorage.getItem('topdog_inventory_badge') || '[]');
            
            if (inventory.includes('badge_goat')) {
                badgeEl.className = 'badge badge-goat'; badgeEl.innerHTML = '🐐 G.O.A.T.';
            } else if (inventory.includes('badge_legend')) {
                badgeEl.className = 'badge badge-legend'; badgeEl.innerHTML = '💎 LEGEND';
            } else if (inventory.includes('badge_apex')) {
                badgeEl.className = 'badge badge-apex'; badgeEl.innerHTML = '👑 APEX';
            } else if (inventory.includes('badge_alpha')) {
                badgeEl.className = 'badge badge-alpha'; badgeEl.innerHTML = '🐺 ALPHA';
            } else {
                badgeEl.className = 'badge badge-sheep'; badgeEl.innerHTML = '🐑 BREBIS';
            }
        }
    </script>

</body>
</html>
