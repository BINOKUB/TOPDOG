<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOPDOG</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="style.css?v=5"> <link rel="icon" type="image/png" href="./icon-dog-192.png">
    <link rel="apple-touch-icon" href="./icon-dog-192.png">
</head>
<body>

    <div class="top-bar">
        <h1>TOPDOG</h1>
        <button class="btn-rules" id="btn-rules">?</button>
    </div>

    <div id="betting-board"></div>

   <div class="hud">
        <div class="hud-item">
            <span class="hud-label">RÉSERVE</span>
            <span id="reserve-count" class="hud-value">40</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">TEMPS</span>
            <span id="timer-container" class="hud-value">02:00</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">SCORE</span>
            <span id="score-display" class="hud-value highlight">0</span>
        </div>
    </div>

    <div class="game-container">
        <div id="game-grid"></div>
        
        <div id="loading-overlay">
            <div style="color:#ff9f43; margin-bottom:10px;">PRÉPARATION DE LA COURSE...</div>
        </div>

        <div id="message-overlay">
            <h2 id="msg-title">TITRE</h2>
            <div id="msg-content"></div>
            <div id="overlay-buttons" style="margin-top:20px;"></div>
        </div>
    </div>

    <div class="controls">
        <button id="btn-hint">INDICE</button>
        <button id="btn-shuffle">BRASSER (<span id="shuffle-count">1</span>)</button>
        <button id="btn-reset">RESET</button>
    </div>

   <script src="logic.js?v=8"></script>
    <script src="ui.js?v=8"></script>

</body>
</html>
